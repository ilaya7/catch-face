<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Catch My Face 😂</title>

<style>

/* =========================
   BASIC
========================= */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    font-family: Arial, sans-serif;
}


/* =========================
   GAME
========================= */

#game {

    position: relative;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    background-image:
        url("background.jpg");

    /* Show complete background */

    background-size: 100% 100%;

    background-position: center;

    background-repeat: no-repeat;

    touch-action: none;
}


/* =========================
   DARK OVERLAY
========================= */

#game::before {

    content: "";

    position: absolute;

    inset: 0;

    background:
        rgba(0,0,0,0.15);

    pointer-events: none;

    z-index: 1;
}


/* =========================
   TOP BAR
========================= */

#topBar {

    position: absolute;

    top: 15px;
    left: 0;

    width: 100%;

    display: flex;

    justify-content:
        space-around;

    align-items: center;

    color: white;

    font-size:
        clamp(20px, 6vw, 32px);

    font-weight: bold;

    text-shadow:
        3px 3px 5px black;

    z-index: 10;

    pointer-events: none;
}


/* =========================
   TITLE
========================= */

#title {

    position: absolute;

    top: 65px;

    width: 100%;

    text-align: center;

    color: white;

    font-size:
        clamp(26px, 8vw, 50px);

    font-weight: bold;

    text-shadow:
        3px 3px 5px black;

    z-index: 10;

    pointer-events: none;
}


/* =========================
   FALLING FACE
========================= */

#face {

    position: absolute;

    width:
        clamp(70px, 20vw, 120px);

    height:
        clamp(70px, 20vw, 120px);

    border-radius: 50%;

    object-fit: cover;

    user-select: none;

    -webkit-user-drag: none;

    box-shadow:
        0 5px 15px
        rgba(0,0,0,0.5);

    z-index: 5;

    pointer-events: none;
}


/* =========================
   BASKET
========================= */

#basket {

    position: absolute;

    bottom: 25px;

    width:
        clamp(110px, 30vw, 180px);

    height:
        45px;

    left: 50%;

    transform:
        translateX(-50%);

    background:
        linear-gradient(
            to bottom,
            #f4a261,
            #c96b2c
        );

    border-radius:
        0 0 25px 25px;

    border:
        5px solid white;

    box-shadow:
        0 5px 10px
        rgba(0,0,0,0.5);

    z-index: 6;
}


/* Basket handle */

#basket::before {

    content: "";

    position: absolute;

    left: 15%;

    top: -28px;

    width: 70%;

    height: 35px;

    border:
        5px solid white;

    border-bottom: none;

    border-radius:
        50% 50% 0 0;
}


/* =========================
   INSTRUCTION
========================= */

#instruction {

    position: absolute;

    bottom: 85px;

    width: 100%;

    text-align: center;

    color: white;

    font-size:
        clamp(15px, 4vw, 21px);

    font-weight: bold;

    text-shadow:
        2px 2px 4px black;

    z-index: 10;

    pointer-events: none;
}


/* =========================
   START SCREEN
========================= */

#screen {

    position: absolute;

    inset: 0;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    padding: 25px;

    background:
        rgba(0,0,0,0.72);

    color: white;

    z-index: 20;
}


#screen h1 {

    font-size:
        clamp(35px, 10vw, 65px);

    margin:
        0 0 15px 0;
}


#screen p {

    font-size:
        clamp(18px, 5vw, 28px);

    margin: 8px;

    line-height: 1.5;
}


/* =========================
   DISCLAIMER
========================= */

.disclaimer {

    max-width: 650px;

    font-size:
        clamp(12px, 3.2vw, 16px) !important;

    line-height: 1.4 !important;

    margin-top: 12px !important;
    margin-bottom: 8px !important;

    padding: 10px 15px;

    border-radius: 10px;

    background:
        rgba(255,255,255,0.12);

    text-align: center;

    color: white;

    text-shadow:
        1px 1px 3px black;
}


/* =========================
   BUTTON
========================= */

#startButton {

    margin-top: 25px;

    padding:
        15px 35px;

    font-size: 22px;

    font-weight: bold;

    border: none;

    border-radius: 15px;

    background: white;

    color: black;

    cursor: pointer;

    box-shadow:
        0 5px 10px
        rgba(0,0,0,0.4);
}

#startButton:active {

    transform:
        scale(0.95);
}


/* =========================
   CATCH EFFECT
========================= */

.catchText {

    position: absolute;

    color: white;

    font-size: 30px;

    font-weight: bold;

    text-shadow:
        2px 2px 4px black;

    z-index: 15;

    pointer-events: none;

    animation:
        catchAnimation 0.7s
        forwards;
}


@keyframes catchAnimation {

    0% {

        opacity: 1;

        transform:
            scale(1)
            translateY(0);
    }

    100% {

        opacity: 0;

        transform:
            scale(1.5)
            translateY(-60px);
    }
}


/* =========================
   MOBILE
========================= */

@media (max-width: 400px) {

    #title {

        top: 60px;

        font-size: 25px;
    }

}

</style>

</head>


<body>


<div id="game">


    <!-- SCORE / TIMER -->

    <div id="topBar">

        <div>
            😎
            <span id="score">0</span>
        </div>

        <div>
            ⏱️
            <span id="time">30</span>
        </div>

    </div>


    <!-- TITLE -->

    <div id="title">

        😂 CATCH MY FACE 😂

    </div>


    <!-- FALLING FACE -->

    <img
        id="face"
        src="face.png"
        alt="Face">


    <!-- BASKET -->

    <div id="basket"></div>


    <!-- INSTRUCTION -->

    <div id="instruction">

        👈 Drag the basket 👉

    </div>


    <!-- START SCREEN -->

    <div id="screen">

        <h1>
            😂 CATCH MY FACE 😂
        </h1>

        <p>
            Catch my face with the basket!
        </p>

        <p>
            🎯 Catch 20 faces to win!
        </p>

        <p class="disclaimer">
            [DISCLAIMER: This game is for entertainment purposes only.
            It is not intended to hurting or harming anyone.
            Please play responsibly and have fun! 😂]
        </p>

        <button id="startButton">

            START GAME 🎮

        </button>

    </div>


</div>


<script>


// =====================================
// ELEMENTS
// =====================================

const game =
    document.getElementById("game");

const face =
    document.getElementById("face");

const basket =
    document.getElementById("basket");

const scoreDisplay =
    document.getElementById("score");

const timeDisplay =
    document.getElementById("time");

const screen =
    document.getElementById("screen");

const startButton =
    document.getElementById("startButton");


// =====================================
// SETTINGS
// =====================================

const GAME_TIME = 30;

const WIN_SCORE = 20;


// =====================================
// VARIABLES
// =====================================

let score = 0;

let timeLeft =
    GAME_TIME;

let gameRunning =
    false;

let timer;

let animationFrame;

let faceX = 0;

let faceY = 0;

let faceSpeed = 3;

let basketX = 0;

let dragging = false;


// =====================================
// SOUND
// =====================================

const catchSound =
    new Audio("flap.mp3");

catchSound.volume = 1.0;


// =====================================
// START GAME
// =====================================

function startGame() {

    score = 0;

    timeLeft =
        GAME_TIME;

    gameRunning =
        true;


    scoreDisplay.textContent =
        score;

    timeDisplay.textContent =
        timeLeft;


    screen.style.display =
        "none";


    /*
       Reset basket
    */

    basketX =
        game.clientWidth / 2;


    updateBasket();


    /*
       Reset speed
    */

    faceSpeed = 3;


    /*
       Start falling face
    */

    resetFace();


    /*
       Start timer
    */

    clearInterval(timer);


    timer =
        setInterval(
            updateTimer,
            1000
        );


    /*
       Start animation
    */

    cancelAnimationFrame(
        animationFrame
    );


    gameLoop();

}


// =====================================
// TIMER
// =====================================

function updateTimer() {

    if (!gameRunning)
        return;


    timeLeft--;


    timeDisplay.textContent =
        timeLeft;


    if (timeLeft <= 0) {

        endGame();

    }

}


// =====================================
// RESET FACE
// =====================================

function resetFace() {

    const gameWidth =
        game.clientWidth;


    const faceWidth =
        face.offsetWidth;


    /*
       Random X position
    */

    faceX =
        Math.random() *
        Math.max(
            1,
            gameWidth - faceWidth
        );


    /*
       Start above screen
    */

    faceY = -face.offsetHeight;


    /*
       Gradually increase speed
    */

    faceSpeed =
        3 +
        score * 0.12;


    face.style.left =
        faceX + "px";


    face.style.top =
        faceY + "px";

}


// =====================================
// GAME LOOP
// =====================================

function gameLoop() {

    if (!gameRunning)
        return;


    /*
       Move face downward
    */

    faceY += faceSpeed;


    face.style.top =
        faceY + "px";


    /*
       Check catch
    */

    checkCatch();


    /*
       Check missed face
    */

    if (
        faceY >
        game.clientHeight
    ) {

        resetFace();

    }


    animationFrame =
        requestAnimationFrame(
            gameLoop
        );

}


// =====================================
// CHECK CATCH
// =====================================

function checkCatch() {

    const faceWidth =
        face.offsetWidth;

    const faceHeight =
        face.offsetHeight;


    const basketLeft =
        basket.offsetLeft;

    const basketRight =
        basketLeft +
        basket.offsetWidth;


    const basketTop =
        basket.offsetTop;


    const faceLeft =
        faceX;

    const faceRight =
        faceX +
        faceWidth;


    const faceBottom =
        faceY +
        faceHeight;


    /*
       Horizontal overlap
    */

    const horizontal =
        faceRight >
        basketLeft &&
        faceLeft <
        basketRight;


    /*
       Vertical overlap
    */

    const vertical =
        faceBottom >= basketTop &&
        faceY <=
        basketTop +
        basket.offsetHeight;


    if (
        horizontal &&
        vertical
    ) {

        catchFace();

    }

}


// =====================================
// CATCH FACE
// =====================================

function catchFace() {


    score++;


    scoreDisplay.textContent =
        score;


    /*
       Play sound
    */

    catchSound.currentTime =
        0;


    catchSound.play().catch(
        function(error) {

            console.log(
                "Sound error:",
                error
            );

        }
    );


    /*
       Show effect
    */

    createCatchText();


    /*
       New face
    */

    resetFace();


    /*
       Check win
    */

    if (
        score >= WIN_SCORE
    ) {

        winGame();

    }

}


// =====================================
// CATCH EFFECT
// =====================================

function createCatchText() {

    const text =
        document.createElement("div");


    const messages = [

        "CAUGHT! 😂",

        "GOT YOU! 😎",

        "BOOM! 💥",

        "NICE! 🔥",

        "HAHA! 😂",

        "CAUGHT YOU! 🤣",

        "GOTCHA! 😎"

    ];


    text.textContent =
        messages[
            Math.floor(
                Math.random() *
                messages.length
            )
        ];


    text.className =
        "catchText";


    text.style.left =
        (
            faceX +
            face.offsetWidth / 2 -
            50
        ) + "px";


    text.style.top =
        (
            faceY -
            10
        ) + "px";


    game.appendChild(text);


    setTimeout(
        function() {

            text.remove();

        },
        700
    );

}


// =====================================
// MOVE BASKET
// =====================================

function moveBasket(clientX) {

    const rect =
        game.getBoundingClientRect();


    const basketWidth =
        basket.offsetWidth;


    basketX =
        clientX -
        rect.left;


    /*
       Keep basket inside screen
    */

    const minX =
        basketWidth / 2;


    const maxX =
        game.clientWidth -
        basketWidth / 2;


    basketX =
        Math.max(
            minX,
            Math.min(
                maxX,
                basketX
            )
        );


    updateBasket();

}


// =====================================
// UPDATE BASKET
// =====================================

function updateBasket() {

    basket.style.left =
        basketX + "px";

}


// =====================================
// TOUCH CONTROLS
// =====================================

game.addEventListener(
    "pointerdown",
    function(event) {

        if (!gameRunning)
            return;


        dragging = true;


        moveBasket(
            event.clientX
        );

    }
);


game.addEventListener(
    "pointermove",
    function(event) {

        if (!dragging)
            return;


        moveBasket(
            event.clientX
        );

    }
);


game.addEventListener(
    "pointerup",
    function() {

        dragging = false;

    }
);


game.addEventListener(
    "pointercancel",
    function() {

        dragging = false;

    }
);


// =====================================
// END GAME
// =====================================

function endGame() {

    gameRunning =
        false;


    cancelAnimationFrame(
        animationFrame
    );


    clearInterval(timer);


    screen.style.display =
        "flex";


    screen.innerHTML = `

        <h1>
            ⏰ TIME'S UP!
        </h1>

        <p>
            You caught
            <strong>${score}</strong>
            faces! 😂
        </p>

        <p>
            🎯 Target: ${WIN_SCORE}
        </p>

        <button id="startButton">

            PLAY AGAIN 🔄

        </button>

    `;


    document
        .getElementById(
            "startButton"
        )
        .addEventListener(
            "click",
            startGame
        );

}


// =====================================
// WIN GAME
// =====================================

function winGame() {

    gameRunning =
        false;


    cancelAnimationFrame(
        animationFrame
    );


    clearInterval(timer);


    screen.style.display =
        "flex";


    screen.innerHTML = `

        <h1>
            🎉 YOU WIN! 🎉
        </h1>

        <p>
            You caught my face
            <strong>20 TIMES!</strong> 😂
        </p>

        <p>
            🏆 AMAZING!
        </p>

        <button id="startButton">

            CATCH AGAIN 😎

        </button>

    `;


    /*
       Voice
    */

    if (
        "speechSynthesis"
        in window
    ) {

        window.speechSynthesis
            .cancel();


        const message =
            "You caught my face twenty times! Amazing!";


        const speech =
            new SpeechSynthesisUtterance(
                message
            );


        speech.rate =
            0.9;


        speech.pitch =
            1.1;


        speech.volume =
            1;


        window.speechSynthesis
            .speak(
                speech
            );

    }


    document
        .getElementById(
            "startButton"
        )
        .addEventListener(
            "click",
            startGame
        );

}


// =====================================
// START BUTTON
// =====================================

startButton.addEventListener(
    "click",
    startGame
);


// =====================================
// INITIAL POSITION
// =====================================

basketX =
    window.innerWidth / 2;


updateBasket();

</script>

</body>

</html>
